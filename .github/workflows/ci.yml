name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:56322/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start local Postgres from the Supabase image
        run: pnpm exec supabase db start
      - run: pnpm db:migrate
      - name: Fail if the migration history is inconsistent
        run: pnpm db:check
      - name: Fail if the schema has changes without a migration
        run: pnpm db:generate && test -z "$(git status --porcelain supabase/migrations)"
      - run: pnpm verify
